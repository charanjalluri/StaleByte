name: Security & Vulnerability Audit

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly security audit at midnight on Mondays
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-audit:
    name: Security Static Analysis & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install security tools & dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit
          pip install -e .[test]

      - name: Run Bandit static security scan
        run: |
          # Audit application code, excluding test harness and virtualenv
          bandit -r . -x ./.venv,./tests,./scratch -ll

      - name: Run pip-audit dependency vulnerability scan
        run: |
          pip-audit . --desc

      - name: Verify repository secret isolation
        run: |
          # Ensure .env is not tracked or accidentally committed
          git ls-files --error-unmatch .env 2>/dev/null && echo "ERROR: .env file is tracked in git!" && exit 1 || echo "✓ .env file is correctly untracked."

      - name: Run adversarial input & injection tests
        run: |
          # Run tests covering malformed DSL, parser bounds, and injection handling
          python -m pytest tests/test_compiler.py tests/test_upload_check.py -v

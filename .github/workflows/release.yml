name: Release & Distribution Validation

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-validate:
    name: Package Build & Distribution Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install build & validation tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          pip install -e .[test]

      - name: Run test suite prior to build
        run: |
          python -m pytest tests/ -q

      - name: Build sdist and wheel
        run: |
          python -m build

      - name: Validate package metadata & archives with Twine
        run: |
          twine check --strict dist/*

      - name: Verify clean wheel installation in isolated environment
        run: |
          python -m venv test_env
          test_env/bin/pip install --upgrade pip
          test_env/bin/pip install dist/*.whl
          test_env/bin/stalebyte --help
          test_env/bin/python demo.py --reset
          test_env/bin/stalebyte demo
          test_env/bin/python demo.py --reset

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist-packages
          path: dist/
          if-no-files-found: error

  publish-github-release:
    name: Publish GitHub Release
    needs: build-and-validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist-packages
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stalebyte"
version = "1.3.0"
description = "Compiled cache staleness verification and content-addressable caching primitive"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [
    { name = "Charan Jalluri", email = "charanjalluri797@gmail.com" }
]
keywords = ["cache", "staleness", "build-system", "compiler", "content-addressable", "sha256"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

[project.scripts]
stalebyte = "cli:main"

[tool.setuptools]
py-modules = ["cli", "cache", "clock", "source", "invalidators", "fuzz", "demo"]
packages = ["stalebyte", "lib", "runtime", "services", "web", "scenarios"]

[tool.pyright]
executionEnvironments = [
  { root = "." }
]
extraPaths = ["."]


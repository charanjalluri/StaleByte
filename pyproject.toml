[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stalebyte"
version = "1.3.0"
description = "Compiled cache staleness verification and content-addressable caching primitive"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"  # verified on 3.8.10; 3.10+ recommended
authors = [
    { name = "Charan Jalluri", email = "charanjalluri797@gmail.com" }
]
keywords = ["cache", "staleness", "build-system", "compiler", "content-addressable", "sha256"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
stalebyte = "cli:main"

[tool.setuptools]
py-modules = ["cli", "cache", "clock", "source", "invalidators", "fuzz", "demo"]
packages = ["stalebyte", "lib", "runtime", "services", "web", "scenarios"]

[tool.pyright]
executionEnvironments = [
  { root = "." }
]
extraPaths = ["."]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
# E501: simulation_service.py contains intentional long error message strings
# E722: cache.py _atomic_write_text cleanup uses intentionally broad bare except
ignore = ["E501", "E722"]

[tool.ruff.lint.isort]
known-first-party = ["cache", "clock", "fuzz", "invalidators", "source", "lib", "runtime", "scenarios", "services", "web"]

